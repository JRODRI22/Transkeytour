<svg width="350" height="100" viewBox="0 0 350 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Elementos gráficos decorativos (circuitos/conexiones) -->
  <circle cx="15" cy="20" r="3" fill="#0ea5e9" opacity="0.6"/>
  <circle cx="35" cy="15" r="2" fill="#3b82f6" opacity="0.5"/>
  <circle cx="45" cy="25" r="2.5" fill="#1e40af" opacity="0.6"/>
  <line x1="15" y1="20" x2="35" y2="15" stroke="#0ea5e9" stroke-width="1" opacity="0.4"/>
  <line x1="35" y1="15" x2="45" y2="25" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
  
  <!-- JR con efecto moderno -->
  <text x="10" y="60" font-family="'Arial Black', sans-serif" font-size="42" font-weight="900" fill="url(#blueGradient)" letter-spacing="-2">JR</text>
  
  <!-- Flecha/línea decorativa -->
  <path d="M 70 35 L 340 35" stroke="#0ea5e9" stroke-width="2" opacity="0.3"/>
  <polygon points="340,35 335,32 335,38" fill="#0ea5e9" opacity="0.5"/>
  
  <!-- DIGITAL -->
  <text x="75" y="45" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1e40af" letter-spacing="1">DIGITAL</text>
  
  <!-- SOLUTIONS -->
  <text x="75" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#3b82f6" letter-spacing="3">SOLUTIONS</text>
  
  <!-- Línea decorativa bajo SOLUTIONS -->
  <line x1="75" y1="75" x2="280" y2="75" stroke="#0ea5e9" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Tagline -->
  <text x="10" y="90" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#6b7280" letter-spacing="0.5">Impulsando empresas en la era digital</text>
</svg>