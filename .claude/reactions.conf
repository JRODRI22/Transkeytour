# Reaction Engine — Configuración de Respuestas Automáticas

> **Inspirado en:** claude-octopus Reaction Engine  
> **Propósito:** Definir qué hace el sistema automáticamente cuando ocurren eventos específicos.  
> Sin este archivo, el sistema solo dice "DETENERSE". Con él, sabe exactamente qué hacer.

---

## Formato de configuración

```
EVENTO|ACCIÓN|MAX_REINTENTOS|ESCALAR_TRAS_MIN|HABILITADO
```

---

