## Tabla de acciones disponibles

| Acción | Descripción |
|--------|-------------|
| `launch_debug_agent` | Lanzar DebugAgent con el error y attempt actual |
| `launch_debug_agent_pivot` | Lanzar DebugAgent con flag `pivot: true` (cambia enfoque) |
| `escalate_to_user` | Detener pipeline y presentar diagnóstico completo al usuario |
| `pause_and_report_to_user` | Pausar y mostrar reporte generado (GATE) |
| `warn_user_then_continue` | Mostrar advertencia y continuar automáticamente |
| `log_and_continue` | Solo registrar en CLAUDE-troubleshooting.md y continuar |
| `trigger_memory_sync` | Lanzar MemorySyncAgent (12) para comprimir contexto |
| `trigger_evolution_agent` | Lanzar EvolutionAgent (16) para procesar lecciones pendientes |
| `trigger_speckit_constitution` | Ejecutar /speckit.constitution antes de continuar |
| `auto_init_from_project_md` | Inicializar state.json desde PROJECT.md automáticamente |
| `ask_user_before_continuing` | Preguntar al usuario antes de continuar (gate pendiente) |
| `launch_api_discovery_first` | Lanzar APIDiscoveryAgent (14) antes del agente objetivo |
| `prepend_database_agent` | Insertar DatabaseAgent antes del agente objetivo |
| `trigger_review_then_memory_sync` | ReviewAgent → MemorySyncAgent secuencialmente |
| `launch_sentinel` | Lanzar SentinelAgent (15) para verificación transversal |
| `recover_or_reinit_from_project_md` | Intentar reparar state.json; si falla, reinicializar desde PROJECT.md |
| `pause_and_warn_user` | Pausar con advertencia (menos severo que escalate_to_user) |
| `trigger_mem_session_summary` | Llamar mem_session_summary() automáticamente al detectar keyword de cierre de sesión |
| `run_git_quick_push` | Ejecutar git-workflows.ps1 -Modo quick en terminal (0 tokens AI) |
| `trigger_memory_sync_aggressive` | Compresión inmediata sin esperar a los umbrales normales |
| `launch_security_agent` | Lanzar SecurityAgent (08) directamente |

