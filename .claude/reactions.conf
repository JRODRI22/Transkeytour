## Keywords de cierre de sesión (session_end_keywords)

Los siguientes mensajes del usuario disparan `trigger_mem_session_summary` automáticamente:

```
chao, bye, hasta luego, cerrando, hasta mañana, nos vemos, cierro, termino por hoy,
me voy, listo por hoy, fin del día, end session, cerrar sesión, guardar sesión,
guarda session, guarda la sesion, save session
```

## Keywords de Git (git_push_keywords)

Los siguientes mensajes del usuario disparan `run_git_quick_push` automáticamente
(abre git-workflows.ps1 con modo quick sin consumir tokens AI):

```
subir a git, push, commit y push, subir cambios, subir código, 
subir a producción, deploy prod, push main, push to git,
git push, hacer push, push de git
```

> **NOTA**: Estos keywords solo aplican cuando el usuario intenta hacer git
> como tarea aislada (sin código que generar/modificar previo). Si hay código
> pendiente por crear, el agente activo completa primero la tarea.

