## Cómo usa el OrchestratorAgent esta configuración

```
1. Al inicio de sesión: cargar reactions.conf
2. Al recibir OUTPUT de cualquier subagente:
   a. Leer status y event_type del OUTPUT
   b. Buscar reacción correspondiente en esta tabla
   c. Ejecutar la acción definida (sin preguntar si HABILITADO=true)
3. Si no hay reacción definida para el evento: DETENERSE y notificar al usuario
```

**Ejemplo de flujo con Reaction Engine:**
```
BackendAgent falla el build
  → Evento: build_failed
  → Reacción: launch_debug_agent (attempt 1)
    → DebugAgent intento 1 falla
      → Evento: build_failed (attempt 2)
      → Reacción: launch_debug_agent (attempt 2)
        → DebugAgent intento 2 falla
          → Evento: build_failed_max_retries
          → Reacción: escalate_to_user
            → DETENER, mostrar diagnóstico completo
```

Sin Reaction Engine este flujo requería 4 intervenciones del usuario.  
Con Reaction Engine es completamente automático.

---

## Personalización

Para deshabilitar una reacción: cambiar `true` a `false` al final de la línea.  
Para agregar una nueva reacción: añadir línea con el formato `EVENTO|ACCIÓN|MAX|ESCALAR_MIN|true`.  
El OrchestratorAgent recarga esta config al inicio de cada sesión automáticamente.
