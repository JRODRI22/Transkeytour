<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Imágenes - Transkeytour</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 20px; 
            background: #f5f5f5;
        }
        .test-card {
            background: white;
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-img {
            width: 100%;
            max-width: 400px;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin: 10px 0;
        }
        .status {
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin: 5px 0;
            font-weight: bold;
        }
        .loaded { background: #4CAF50; color: white; }
        .failed { background: #f44336; color: white; }
        .loading { background: #FFC107; color: black; }
        h1 { color: #00B4D8; }
        h2 { color: #333; margin-top: 0; }
    </style>
</head>
<body>
    <h1>🔍 Test de Carga de Imágenes - Transkeytour</h1>
    <p>Verificando que todas las imágenes carguen correctamente...</p>

    <div id="results"></div>

    <script>
        const images = [
            { name: 'Hero Background', url: 'https://images.unsplash.com/photo-1559827260-dc66d52bef19?w=800&q=80' },
            { name: 'Galería 1 - Snorkeling', url: 'https://images.unsplash.com/photo-1583737115161-fe0e701da5de?w=800&q=80' },
            { name: 'Galería 2 - Estrellas de Mar', url: 'https://images.unsplash.com/photo-1582719508461-905c673771fd?w=800&q=80' },
            { name: 'Galería 3 - Lanchas', url: 'https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=800&q=80' },
            { name: 'Galería 4 - Atardeceres', url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&q=80' },
            { name: 'Galería 5 - Vida Marina', url: 'https://images.unsplash.com/photo-1530053969600-caed2596d242?w=800&q=80' },
            { name: 'Destino 1 - Playa Estrellas', url: 'https://images.unsplash.com/photo-1582719508461-905c673771fd?w=600&q=80' },
            { name: 'Destino 2 - Bahía Delfines', url: 'https://images.unsplash.com/photo-1559827260-dc66d52bef19?w=600&q=80' },
            { name: 'Destino 3 - Cayo Coral', url: 'https://images.unsplash.com/photo-1583737115161-fe0e701da5de?w=600&q=80' },
            { name: 'Destino 4 - Hollywood Reef', url: 'https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=600&q=80' },
            { name: 'Destino 5 - Isla Zapatilla', url: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600&q=80' },
            { name: 'Destino 6 - Punta Caracol', url: 'https://images.unsplash.com/photo-1530053969600-caed2596d242?w=600&q=80' }
        ];

        const resultsDiv = document.getElementById('results');
        let loaded = 0;
        let failed = 0;

        images.forEach((imgData, index) => {
            const card = document.createElement('div');
            card.className = 'test-card';
            card.innerHTML = `
                <h2>${imgData.name}</h2>
                <div class="status loading" id="status-${index}">⏳ Cargando...</div>
                <br>
                <img class="test-img" id="img-${index}" alt="${imgData.name}">
                <br>
                <small style="color: #666; word-break: break-all;">${imgData.url}</small>
            `;
            resultsDiv.appendChild(card);

            const img = document.getElementById(`img-${index}`);
            const status = document.getElementById(`status-${index}`);

            img.onload = () => {
                status.className = 'status loaded';
                status.textContent = '✅ Cargada correctamente';
                loaded++;
                updateSummary();
            };

            img.onerror = () => {
                status.className = 'status failed';
                status.textContent = '❌ ERROR - No se pudo cargar';
                failed++;
                updateSummary();
            };

            img.src = imgData.url;
        });

        function updateSummary() {
            const total = images.length;
            if (loaded + failed === total) {
                const summary = document.createElement('div');
                summary.style.cssText = 'position: fixed; top: 20px; right: 20px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);';
                summary.innerHTML = `
                    <h3 style="margin: 0 0 10px 0;">📊 Resumen</h3>
                    <p style="margin: 5px 0;"><strong>Total:</strong> ${total}</p>
                    <p style="margin: 5px 0; color: #4CAF50;"><strong>✅ Cargadas:</strong> ${loaded}</p>
                    <p style="margin: 5px 0; color: #f44336;"><strong>❌ Fallidas:</strong> ${failed}</p>
                    <p style="margin: 15px 0 0 0; padding-top: 10px; border-top: 2px solid #eee;">
                        ${failed === 0 ? '🎉 <strong>Todas las imágenes OK!</strong>' : '⚠️ <strong>Hay imágenes con problemas</strong>'}
                    </p>
                `;
                document.body.appendChild(summary);
            }
        }
    </script>
</body>
</html>
